name: WebNovels CI / Build & Test Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Setup Node.js v24
      uses: actions/setup-node@v4.2.0
      with:
        node-version: 24
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Push Prisma SQLite Schema
      run: npx prisma db push

    - name: Run Backend Integration & System Tests
      run: npm run test
      env:
        SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID || 'ci_super_admin' }}
        SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD || 'ci_super_pass123!' }}
        SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL || 'ci_super@webnovel.local' }}

    - name: Check Build Output
      run: npm run build
