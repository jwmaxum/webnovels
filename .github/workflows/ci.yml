name: WebNovels CI / Build & Test Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js v24
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Push Prisma SQLite Schema
      run: npx prisma db push

    - name: Run Backend Integration & System Tests
      run: npm run test
      env:
        SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID || 'jwmaxum@gmail.com' }}
        SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD || 'sang@4478000' }}
        SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL || 'jwmaxum@gmail.com' }}

    - name: Check Build Output
      run: npm run build
