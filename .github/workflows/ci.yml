name: WebNovels CI / Build & Test Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.node-version'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Reject high and critical dependency advisories
      run: npm audit --audit-level=high

    - name: Verify release contracts, Functions bundle and build
      run: npm run build

  native-settlement-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Ubuntu 24.04's shipped server; local acceptance also runs PostgreSQL 17.
      OP08_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.node-version'
        cache: 'npm'
    - run: npm ci
    - name: Verify disposable native PostgreSQL concurrency and restore
      run: npm run verify:op08:native
    - name: Verify recovery after source cluster shutdown
      run: npm run verify:op09:native
    - name: Verify payout TEST dispatch race and restored dispatch marker
      run: npm run verify:op10:native
