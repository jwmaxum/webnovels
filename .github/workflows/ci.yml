name: WebNovels CI / Build & Test Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Verify Supabase data and Cloudflare security contracts
      run: |
        npm run test:data
        npm run test:p0
        npm run test:auth
        npm run test:naming
        npm run test:authoring-schema
        npm run test:creator-works
        npm run test:drafts
        npm run test:files
        npm run test:publication

    - name: Push Prisma SQLite Schema
      run: npx prisma db push

    - name: Run Backend Integration & System Tests
      run: npm run test
      continue-on-error: true
      env:
        SUPER_ADMIN_ID: ${{ secrets.SUPER_ADMIN_ID || 'ci_super_admin' }}
        SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD || 'ci_super_pass123!' }}
        SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL || 'ci_super@webnovel.local' }}

    - name: Check Build Output
      run: npm run build
