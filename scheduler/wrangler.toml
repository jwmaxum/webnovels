name = "webnovels-authoring-scheduler"
main = "worker.mjs"
compatibility_date = "2026-09-23"

[triggers]
crons = ["* * * * *"]

[vars]
AUTHOR_PUBLISH_ENABLED = "false"
WEBTOON_SERVICE_ENABLED = "false"
GROWTH_SERVICE_ENABLED = "false"
GROWTH_MEASUREMENT_ENABLED = "false"

# Set SUPABASE_URL and SUPABASE_SECRET_KEY as deployment secrets/vars.
# Enable only after the reviewed 008 (and 015 for webtoons) migration and staging acceptance.
